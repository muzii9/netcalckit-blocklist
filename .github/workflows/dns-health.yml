name: Scheduled DNS health

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dns-health:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DNS tools
        run: sudo apt-get update && sudo apt-get install -y dnsutils

      - name: Check published rule DNS health
        run: python3 scripts/check_dns_health.py --rules --output rule-dns-health.csv

      - name: Check staged candidate DNS health
        run: python3 scripts/check_dns_health.py --candidates --output candidate-dns-health.csv

      - name: Upload DNS health reports
        uses: actions/upload-artifact@v4
        with:
          name: dns-health-reports
          retention-days: 30
          path: |
            rule-dns-health.csv
            candidate-dns-health.csv
