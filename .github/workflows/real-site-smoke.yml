name: Live public-site A/B smoke

on:
  pull_request:
    paths:
      - "scripts/real_site_smoke.py"
      - "tests/live-site-cases.json"
      - "tests/test_real_site_config.py"
      - "rules/rules.csv"
      - "blocklists/standard.txt"
      - ".github/workflows/real-site-smoke.yml"
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * 2" # weekly regression; reports drift without changing rules

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # allow comparison with PR base rules for new-host coverage
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate test registry and new-rule coverage helpers
        run: python -m unittest discover -s tests -p "test_real_site_config.py" -v
      - name: Check preinstalled Chrome
        run: which google-chrome || which google-chrome-stable || which chromium
      - name: Install Playwright bindings
        run: python -m pip install playwright==1.55.0
      - name: Run real public-site comparisons
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/real_site_smoke.py
      - name: Upload sanitized test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-site-browser-smoke
          path: qa-reports/
          if-no-files-found: warn
          retention-days: 30
